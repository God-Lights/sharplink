name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 (예: 1.0.0)'
        required: true
        type: string
      release_type:
        description: '릴리즈 종류'
        required: true
        type: choice
        options:
          - beta
          - release
        default: beta

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set project version
        run: mvn -B org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Build with Maven
        run: mvn -B package

      - name: Determine tag name and prerelease flag
        id: meta
        run: |
          if [ "${{ inputs.release_type }}" = "beta" ]; then
            echo "tag=v${{ inputs.version }}-beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(--title "${{ steps.meta.outputs.tag }}" --generate-notes)
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${{ steps.meta.outputs.tag }}" \
            "target/TerritoryWar-${{ inputs.version }}.jar" \
            "${ARGS[@]}"
