name: Lambda
version: '${project.version}'
main: com.sharplink.lambda.LambdaPlugin
api-version: '1.21'
author: SharpLink
description: 야생 서버용 람다(λ) 화폐 시스템 플러그인

commands:
  lambda:
    description: 람다 화폐 관리 명령어
    usage: /lambda [balance|give|set] <플레이어> <금액>

permissions:
  lambda.admin:
    description: 람다 화폐를 지급/설정할 수 있는 권한
    default: op
