name: TerritoryWar
version: '${project.version}'
main: com.sharplink.territorywar.TerritoryWarPlugin
api-version: '1.21'
author: SharpLink
description: 야생 서버용 영토전쟁(깃발 정복) 게임 플러그인

commands:
  team:
    description: 팀 정보 확인, 깃발 목록, 반편입자 합류 명령어
    usage: /team [info|flags|join] <팀 이름>
  flag:
    description: 깃발 아이템 지급 관리자 명령어
    usage: /flag [give|serverflag] <플레이어>
    permission: territorywar.admin
  game:
    description: 게임 시작/초기화/디버그 모드 관리자 명령어
    usage: /game [start|reset|debug] ...
    permission: territorywar.admin

permissions:
  territorywar.admin:
    description: 영토전쟁 게임을 관리할 수 있는 권한
    default: op
