<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharpLink 프로젝트 위키</title>
<meta name="description" content="SharpLink 마인크래프트 플러그인 프로젝트 문서 모음">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="6" y="4" width="4" height="32" fill="var(--text-dim)"/>
      <polygon points="10,6 32,6 32,17 22,22 32,27 32,38 10,38" fill="var(--lime)"/>
    </svg>
    <h1>SharpLink 프로젝트 위키</h1>
    <p class="tagline">마인크래프트 서버 플러그인 프로젝트 문서 모음입니다. 아래 목록에서 프로젝트를 선택하세요.</p>
  </div>
</header>

<main>
  <section id="projects">
    <div class="section-head"><span class="tag">PROJECTS</span><h2>게임 프로젝트</h2></div>
    <ul class="project-list">
      <li>
        <a class="project-card" href="/api/mcproj/game/territory-war/">
          <span class="project-name">땅따먹기 플러그인</span>
          <span class="project-desc">깃발을 세워 100x100 영토를 정복하는 팀 대전 게임</span>
          <span class="project-meta mono">v1.0.0 · BETA</span>
        </a>
      </li>
    </ul>
  </section>
</main>

<footer class="note">
  <div class="note-box">
    <span class="tag">NOTE</span>
    <p>새 프로젝트는 <code>/api/mcproj/game/&lt;프로젝트 슬러그&gt;/</code> 경로에 추가됩니다.</p>
  </div>
</footer>

</body>
</html>
